[package]
name = "eos_monitor"
version = "0.1.0"
edition = "2021"
description = "TowerClash dev tool: watch EOS sessions (listeners) and game server status (connections, drops)"
publish = false

[dependencies]
libloading = "0.8"
serde_json = "1"
ratatui = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
strip = true
